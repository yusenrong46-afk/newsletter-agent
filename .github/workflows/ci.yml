name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13", checks: true, publish: true }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # This action publishes exact version tags only.
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Lint (ruff)
        if: matrix.checks
        run: uv run ruff check .
      - name: Type check (mypy)
        if: matrix.checks
        run: uv run mypy
      - name: Tests (offline, synthetic email only)
        run: uv run pytest -q
      - name: Demo smoke test
        run: uv run newsletter-agent demo --output site
      - name: Quality eval (offline stand-in)
        run: uv run newsletter-agent eval --output site/eval
      - name: Add the upgrade report to the site
        if: matrix.publish
        run: cp docs/upgrade-report.html site/upgrade-report.html
      - name: Upload demo site
        if: matrix.publish
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-demo:
    # Publishes the synthetic demo report to GitHub Pages. No real email is involved.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
